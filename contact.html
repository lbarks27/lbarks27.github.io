    <main class="project-shell">
      <section class="contact-find-banner" aria-labelledby="contact-find-title">
        <div class="container contact-find-banner-inner">
          <h1 class="contact-find-title" id="contact-find-title">Where To Find Me</h1>
          <nav class="contact-banner-links" aria-label="Social and contact links">
            <a class="contact-banner-link" data-owner-email-link href="mailto:barkley.liam.m@gmail.com">Email</a>
            <a class="contact-banner-link" data-owner-github-link href="https://github.com/lbarks27" target="_blank" rel="noreferrer">GitHub</a>
            <a class="contact-banner-link" data-owner-youtube-link href="https://www.youtube.com/@lbarks27" target="_blank" rel="noreferrer">YouTube</a>
            <a class="contact-banner-link" data-owner-x-link href="https://x.com/lbarks27" target="_blank" rel="noreferrer">X</a>
            <a class="contact-banner-link" data-owner-instagram-link href="https://www.instagram.com/lbarks27/" target="_blank" rel="noreferrer">Instagram</a>
          </nav>
        </div>
      </section>

      <section class="section contact-section">
        <div class="container">
          <div class="contact-form-shell" data-reveal>
            <h2 class="contact-heading">Start A Conversation</h2>
            <form class="contact-form" data-contact-form action="mailto:barkley.liam.m@gmail.com" method="post" enctype="text/plain">
              <div class="contact-form-grid">
                <label class="form-field">
                  <span>Name</span>
                  <input name="name" type="text" autocomplete="name" placeholder="Your name" required>
                </label>
                <label class="form-field">
                  <span>Email</span>
                  <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                </label>
                <label class="form-field form-field-full">
                  <span>Subject</span>
                  <input name="subject" type="text" autocomplete="off" placeholder="What would you like to discuss?" required>
                </label>
                <label class="form-field form-field-full">
                  <span>Message</span>
                  <textarea name="message" rows="7" placeholder="Project context, timeline, or the question you have in mind." required></textarea>
                </label>
              </div>
              <div class="contact-form-actions">
                <button class="btn btn-primary" type="submit">Send Message</button>
                <p class="contact-form-note" data-contact-form-status aria-live="polite">Creates a prefilled email draft.</p>
              </div>
            </form>
          </div>
        </div>
      </section>
